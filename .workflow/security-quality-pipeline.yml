version: '1.0'
name: security-quality-pipeline
displayName: SecurityQualityPipeline
stages:
  - stage:
    name: verify
    displayName: 安全质量门禁
    strategy: naturally
    trigger: auto
    steps:
      - step: build@maven
        name: backend_test_sbom
        displayName: JDK17 后端测试与 SBOM
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - chmod +x scripts/ci/*.sh
          - scripts/ci/verify-toolchain.sh --backend
          - mvn -B -f forge-server/pom.xml -Penable-tests,security-ci verify
        artifacts:
          - name: BACKEND_SECURITY_ARTIFACT
            path:
              - ./forge-server/target/bom.json
      - step: build@maven
        name: frontend_build
        displayName: Node20 前端生产构建
        jdkVersion: 17
        mavenVersion: 3.6.3
        commands:
          - chmod +x scripts/ci/*.sh
          - scripts/ci/run-frontend-gates.sh
triggers:
  push:
    branches:
      include:
        - main
  pr:
    branches:
      include:
        - main
